[package]
name = "cv-maker"
version = "0.1.0"
description = "Private offline-first resume studio"
authors = ["CV Maker contributors"]
edition = "2021"

[lib]
name = "cv_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
